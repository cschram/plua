[package]
name = "plua"
version = "0.1.0"
edition = "2024"
authors = ["Corey Schram <coreyschram@gmail.com>"]

[lib]
name = "plua"
path = "src/lib.rs"

[[bin]]
name = "plua"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.96"
clap = { version = "4.5.31", features = ["derive"] }
log = "0.4.26"
mlua = { version = "0.10.3", features = ["lua54", "vendored", "anyhow"] }
pest = "2.7.15"
pest_derive = "2.7.15"
simple_logger = "5.0.0"
